name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: "stable"

      - name: Build Debug APK
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/g' android/app/build.gradle || true
          flutter pub get
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk Tally_Prime.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          name: "Tally Prime Mobile"
          files: Tally_Prime.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
